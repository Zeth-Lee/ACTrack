[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "actrack"
version = "0.1.0"
description = "ACTrack RGB tracking with a shared DiDi evaluation interface"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26,<2", "Pillow>=10", "PyYAML>=6"]

[project.optional-dependencies]
didi = ["vot-toolkit==0.8.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


